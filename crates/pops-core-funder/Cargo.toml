[package]
name = "pops-core-funder"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PoPs funder-side crypto: taproot output-key + CLTV recovery script (OP_VERIFY leaf) construction"

[lib]
# Plain rlib. This crate is NON-WASM (no cdylib): bitcoin's secp256k1 dep
# pulls C, so the WASM surface lives elsewhere. Native consumers only.

[dependencies]
# bitcoin 0.32.2, default-features off, with the feature set this script code
# needs: std + serde + rand + rand-std.
bitcoin = { version = "0.32.2", default-features = false, features = ["std", "serde", "rand", "rand-std"] }

# Typed kernel errors (RecoverError) — stable, exhaustive.
thiserror = "1"

# Hex encoding for the recovery leaf-script / scriptPubKey mismatch diagnostics
# carried inside RecoverError variants.
hex = "0.4"
