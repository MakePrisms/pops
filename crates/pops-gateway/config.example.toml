# pops-gateway — example config.
#
# Copy this to `config.toml`, fill in the five REQUIRED facts below, then run
# the gateway pointing at it (see the README quickstart). The gateway reads the
# path in the POPS_GATEWAY_CONFIG env var, defaulting to
# /etc/pops-gateway/config.toml. This file is parsed by the gateway's `Config`
# (serde, `deny_unknown_fields`) — keep field names and table nesting exactly
# as shown; an unknown key is a fail-fast error.

# ── REQUIRED — the five facts ────────────────────────────────────────────────

# Your existing API, unmodified. Every gated request is forwarded here on a
# successful charge. Must be an absolute http(s) URL.
upstream_url = "http://your-api:3000"

# The pops mint the presented credential is redeemed against (a NUT-03 swap).
# Also the target of the /readyz reachability probe. Must be http(s).
mint_url = "https://mint.example.com"

# WHERE received value lands — this path is a WALLET. It MUST be a persistent
# mount: each line holds spendable bearer proofs, so if it lives on an ephemeral
# container layer a restart DESTROYS received value. No default on purpose. Its
# parent directory must already exist and be writable.
proofs_sink = "/data/proofs.jsonl"

# ── OPTIONAL ─────────────────────────────────────────────────────────────────

# Gateway's own listen address. Default: 0.0.0.0:8080.
# listen = "0.0.0.0:8080"

# Max buffered request-body size in BYTES. The gateway buffers each request body
# in full before forwarding it upstream; a larger body is rejected with
# `413 Payload Too Large` (on a gated path, BEFORE any charge — the pop is not
# consumed). This caps memory so an unbounded body on a public path can't OOM
# the process. Default: 1048576 (1 MiB). Raise it if your API takes large
# uploads.
# max_body_bytes = 1048576

# Upstream request timeout in SECONDS (connect + total). Bounds a hung upstream
# so a request whose pop was already redeemed isn't stranded forever, and makes
# the 504 response reachable. Default: 30. Set to 0 to disable (NOT recommended).
# upstream_timeout_secs = 30

# Per-call MINT HTTP timeout in SECONDS (keysets / keys / swap). Bounds a hung
# mint so the request surfaces as 503 mint-unavailable instead of hanging.
# Default: 10. Must be > 0 (0 is a config error — a mint call can consume the
# token, so it must always be bounded).
# mint_http_timeout_secs = 10

# Hex-encoded server SECRET for the stateless challenge binding: each 402's
# `id` is an HMAC-SHA256 over the issued challenge params under this key. At
# least 16 bytes (32 hex chars); 32 bytes (64 hex chars) recommended. The
# POPS_BINDING_KEY env var, when set, OVERRIDES this value (so the secret can
# stay out of the mounted file). Omitted ⇒ a fresh key is generated at boot:
# outstanding challenges then die with the process and clients refetch the
# 402 — fine for a single instance, but configure a stable key for restarts or
# multiple replicas. NEVER log or share it.
# binding_key = "<64 hex chars>"

# Challenge lifetime in SECONDS, stamped into each challenge's `expires`
# auth-param. A credential echoing a challenge older than this is rejected as
# payment-expired (the client refetches). Default: 300. Must be > 0 (a 0-TTL
# challenge is born expired).
# challenge_ttl_secs = 300

[charge]
# The pop_<unix_ts> currency unit you accept.
#
# NOTE: pop units are CLTV-dated and ROTATE — a given pop_<ts> eventually goes
# inactive; use your mint's currently-ACTIVE unit: GET <mint_url>/v1/keysets and
# pick a keyset with `active: true`. The value below is currently active (it is
# also the Vercel demo's default), but confirm against your mint.
unit = "pop_1780372941"

# Exact net value required per request. Must be > 0.
amount = 1

# ── OPTIONAL ─────────────────────────────────────────────────────────────────

# Mints the verifier accepts. Defaults to [mint_url] when omitted.
# Uncomment to accept tokens from more than just `mint_url`.
# [charge] continues here — `mints` / `description` are keys of the [charge] table.
# mints = ["https://mint.example.com", "https://mint-b.example.com"]

# Human-readable description shown in the 402 challenge.
# description = "my API"

# Max proofs accepted per credential — a pre-swap DoS guard (a token stuffed
# with tiny proofs inflates swap cost). Over the cap → 402 BEFORE any swap (the
# pop is not consumed). Default: 64 (generous; an exact-amount token needs only
# a handful). Must be > 0.
# max_proofs = 64

# OPTIONAL per-path gating rules. Absent ⇒ gate EVERY path. When present, only
# paths matching a non-`public` rule are gated; `public = true` paths forward
# WITHOUT a gate. Each rule is a [[routes]] table.
# [[routes]]
# path   = "/health/*"
# public = true            # forwarded WITHOUT a gate
#
# [[routes]]
# path   = "/api/*"        # gated (public defaults to false)
