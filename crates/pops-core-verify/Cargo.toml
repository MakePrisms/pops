[package]
name = "pops-core-verify"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PoPs ecash-agnostic verify core: Credential trait + CashuCredential<M:MintClient>; verify+swap-to-redeem behind a swappable MintClient; native (axum/cdk) + wasm surfaces."

[lib]
# rlib for native consumers (gateway, demos); cdylib so the `wasm` feature
# can be built to wasm32 via wasm-pack/wasm-bindgen.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The verify crypto + token/proof/keyset types. Compiles to wasm32 (cashu ships
# a cfg(target_arch="wasm32") block).
cashu = "0.16"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# thiserror "1" for the charge contract and unit grammar; cashu/cdk pull
# thiserror 2 transitively — both majors coexist.
thiserror = "1"
# SHA-256 for RedeemedProofs.token_hash (lowercase hex of the presented token).
# Pure-Rust, wasm-clean — kept out of the cashu/secp dep so the envelope-only
# wasm surface stays lean while token_hash is still computable in core.
sha2 = "0.10"
# HMAC-SHA256 for the framework's stateless challenge binding (the `id` is
# base64url(HMAC(server_key, the 7 pipe-joined slots))). Pure-Rust, wasm-clean.
hmac = "0.12"
# OS randomness for the generate-at-boot binding-key fallback. Already in the
# tree transitively; the `wasm` feature flips on its `js` backend.
getrandom = "0.2"
# JCS / RFC 8785 canonical JSON for the `request` object and the `Authorization`
# credential blob (`draft-cashu-charge-01` §Encoding): lexicographic key sort +
# ECMAScript number formatting, over serde_json. Pure-Rust + wasm-clean (ryu-js
# for the number serialization), so the envelope codec stays wasm-targetable.
serde_jcs = "0.1"
# Operator-facing diagnostics from the shared swap ceremony — the WARN on a
# missing/invalid swap-output DLEQ (`draft-cashu-charge-01` §security-dleq:
# alert + quarantine, never fail the payment). Core-only, wasm-clean; hosts
# bring their own subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# ── native feature deps (off on wasm) ───────────────────────────────────────
# cdk supplies wallet::{HttpClient, MintConnector} for the real MintClient.
cdk = { version = "0.16", default-features = false, features = ["wallet"], optional = true }
# axum 0.7 powers the require_charge middleware (from_fn_with_state + Next::run).
axum = { version = "0.7", optional = true }
# http types (StatusCode / HeaderValue) used directly by the middleware.
http = { version = "1", optional = true }
# uuid is NOT used by this crate's code anymore (the HMAC challenge binding
# replaced the old uuid-v4 challenge `id`); it stays declared only so the
# `wasm` feature can flip `uuid/js` on the uuid that cashu pulls transitively
# (see the `[features]` note).
uuid = { version = "1", features = ["v4"], optional = true }
# tokio::time::timeout bounds every mint HTTP call in `cdk_mint_client` (a hung
# mint must surface as the 503 mint-unavailable path, not hang the request).
tokio = { version = "1", features = ["time"], optional = true }
# RFC 3339 parsing + the wall clock for the middleware's `challenge.expires`
# enforcement and the `Payment-Receipt` timestamp. Native-only: the wasm surface
# decodes but does not enforce expiry.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }

# ── wasm feature deps (off on native) ───────────────────────────────────────
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# web-sys supplies the typed `Response` (for `.status()` + `.text()`) the
# injected-fetch MintClient reads. `fetch` itself is invoked via js-sys
# reflection on `globalThis` (Node has no `window`/Worker global), so only the
# Response feature is needed here.
web-sys = { version = "0.3", optional = true, features = ["Response"] }
[features]
default = ["native"]
native = ["dep:cdk", "dep:axum", "dep:http", "dep:uuid", "dep:chrono", "dep:tokio"]
# `uuid/js` selects uuid's wasm randomness backend. uuid is pulled
# TRANSITIVELY by cashu (not just our native dep), and uuid 1.23+ refuses to
# compile on wasm32 without an explicit randomness feature; `getrandom/js`
# alone no longer satisfies it. Enabling `uuid/js` here activates that backend
# on the uuid already in the graph.
wasm = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "getrandom/js", "uuid/js"]

[dev-dependencies]
# async test runtime for the folded validator/middleware tests; `net` serves
# the hung-mint listeners the mint-HTTP-timeout tests bind on 127.0.0.1.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
# tower::ServiceExt::oneshot drives the axum router in the middleware tests.
tower = "0.5"
